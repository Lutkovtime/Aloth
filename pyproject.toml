[project]
name = "aloth"
version = "0.1.1"
description = "Aloth (Amazing Sloth) — open-source AI agent for everyone"
readme = "README.md"
authors = [
    { name = "Lutkovtime", email = "sasha.lutkov@gmail.com" }
]
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "ddgs==9.15.0",
    "httpx==0.28.1",
    "keyring==25.7.0",
    "pydantic-ai==2.32.1",
    "pyside6==6.11.2",
    "qt-material==2.17",
    "qtawesome==1.4.2",
]

[project.scripts]
aloth = "aloth.cli:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "nuitka==4.1.3",
    "pyinstaller==6.22.2",
]
